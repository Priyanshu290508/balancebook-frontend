<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Gradient Border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="4" />

  <!-- Inner Subtle Glass Glow -->
  <rect x="10" y="10" width="108" height="54" rx="24" fill="white" fill-opacity="0.04" />

  <!-- BalanceBook Icon: Stylized Open Ledger Book with Balanced Scales & Letter B Flow -->
  <g filter="url(#glow)">
    <!-- Book Spine Center -->
    <line x1="64" y1="36" x2="64" y2="92" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Left Book Page / Left Balance Wing -->
    <path d="M64 42 C 50 36, 32 38, 24 43 L 24 85 C 32 80, 50 78, 64 84 Z" 
          fill="url(#strokeGrad)" fill-opacity="0.18" 
          stroke="url(#glowGrad)" stroke-width="3" stroke-linejoin="round" />

    <!-- Right Book Page / Right Balance Wing -->
    <path d="M64 42 C 78 36, 96 38, 104 43 L 104 85 C 96 80, 78 78, 64 84 Z" 
          fill="url(#strokeGrad)" fill-opacity="0.25" 
          stroke="url(#glowGrad)" stroke-width="3" stroke-linejoin="round" />

    <!-- Central Balance Scale Fulcrum / Upward Growth Triangle -->
    <polygon points="64,48 59,57 69,57" fill="#34d399" />

    <!-- Horizontal Balance Beam -->
    <line x1="38" y1="52" x2="90" y2="52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Left Balance Pan -->
    <path d="M38 53 L 34 65 L 42 65 Z" fill="#22d3ee" />
    <path d="M31 65 Q 38 72 45 65 Z" fill="#10b981" />

    <!-- Right Balance Pan (Slightly elevated indicating Profit/Surplus) -->
    <path d="M90 53 L 86 63 L 94 63 Z" fill="#22d3ee" />
    <path d="M83 63 Q 90 70 97 63 Z" fill="#34d399" />

    <!-- Sparkle / Profit Accent -->
    <circle cx="64" cy="32" r="3.5" fill="#38bdf8" />
  </g>
</svg>
